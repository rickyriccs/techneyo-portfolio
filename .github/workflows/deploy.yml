name: Deploy React Production to Hostinger

on:
  push:
    branches:
      - production
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST) to generate and deploy fresh sitemap & latest DB content
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Fresh and Deploy Dist
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fresh install dependencies
        run: npm ci

      - name: Verify frontend environment
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "Missing VITE_SUPABASE_URL. Add it in GitHub Settings > Secrets and variables > Actions > Variables or Secrets."
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing VITE_SUPABASE_ANON_KEY. Add it in GitHub Settings > Secrets and variables > Actions > Variables or Secrets."
            exit 1
          fi

      - name: Build React project
        run: npm run build

      - name: Confirm dist folder
        run: |
          ls -la
          ls -la dist
          test -f dist/.htaccess

      - name: Deploy dist files to Hostinger public_html
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.HOSTINGER_DEPLOY_PATH || 'public_html/' }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/subdomains/, /.well-known/"
