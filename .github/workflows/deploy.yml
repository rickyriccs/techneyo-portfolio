name: Deploy React Production to Hostinger

on:
  push:
    branches:
      - production
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST) to generate and deploy fresh sitemap
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Fresh and Deploy Dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fresh install dependencies
        run: npm ci

      - name: Build React project & API
        run: npm run build

      - name: Confirm dist folder & backend assets
        run: |
          ls -la
          ls -la dist
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/index.php
          echo "Verified dist/ contains index.html, .htaccess, and api/index.php"

      - name: Deploy dist files to Hostinger public_html
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.HOSTINGER_DEPLOY_PATH || 'public_html/' }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/subdomains/, /.well-known/, /.env*, /api/.env*"
