name: Deploy React Production to Hostinger

on:
  push:
    branches:
      - production
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST) to generate and deploy fresh sitemap
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Fresh and Deploy Dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fresh install dependencies
        run: npm ci

      - name: Build React project & API
        run: npm run build

      - name: Inject production environment secrets into dist/.env
        env:
          MYSQL_HOST: ${{ vars.MYSQL_HOST || secrets.MYSQL_HOST || vars.DB_HOST || secrets.DB_HOST || 'localhost' }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT || secrets.MYSQL_PORT || vars.DB_PORT || secrets.DB_PORT || '3306' }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE || secrets.MYSQL_DATABASE || vars.MYSQL_DB || secrets.MYSQL_DB || vars.DB_NAME || secrets.DB_NAME || vars.DB_DATABASE || secrets.DB_DATABASE || '' }}
          MYSQL_USER: ${{ vars.MYSQL_USER || secrets.MYSQL_USER || vars.DB_USER || secrets.DB_USER || vars.MYSQL_USERNAME || secrets.MYSQL_USERNAME || '' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASSWORD || secrets.MYSQL_PASS || secrets.DB_PASS || vars.MYSQL_PASSWORD || vars.DB_PASSWORD || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET || 'techneyo_jwt_super_secret_key_2026_production' }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL || 'admin@techneyo.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD || '' }}
        run: |
          if [ -n "${MYSQL_DATABASE}" ] && [ -n "${MYSQL_USER}" ]; then
            cat << EOF > dist/.env
MYSQL_HOST=${MYSQL_HOST}
MYSQL_PORT=${MYSQL_PORT}
MYSQL_DATABASE=${MYSQL_DATABASE}
MYSQL_USER=${MYSQL_USER}
MYSQL_PASSWORD=${MYSQL_PASSWORD}
JWT_SECRET=${JWT_SECRET}
ADMIN_EMAIL=${ADMIN_EMAIL}
ADMIN_PASSWORD=${ADMIN_PASSWORD}
EOF
            echo "Successfully generated dist/.env from GitHub Secrets & Variables."
          else
            echo "Notice: MYSQL_DATABASE or MYSQL_USER empty in GitHub Secrets/Variables. Skipping dist/.env generation."
          fi

      - name: Confirm dist folder & backend assets
        run: |
          ls -la
          ls -la dist
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/index.php
          echo "Verified dist/ contains index.html, .htaccess, and api/index.php"

      - name: Deploy dist files to Hostinger public_html
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.HOSTINGER_DEPLOY_PATH || 'public_html/' }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/subdomains/, /.well-known/"
