name: Deploy React Production to Hostinger

on:
  push:
    branches:
      - production
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST) to generate and deploy fresh sitemap
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Fresh and Deploy Dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fresh install dependencies
        run: npm ci

      - name: Build React project & API
        run: npm run build

      - name: Inject production environment secrets into dist/.env
        env:
          MYSQL_HOST: ${{ vars.MYSQL_HOST || secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT || secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE || secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER || secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
          DB_DATABASE: ${{ vars.DB_DATABASE || vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'techneyo_jwt_super_secret_key_2026_production' }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ACTUAL_HOST="${MYSQL_HOST:-${DB_HOST:-localhost}}"
          ACTUAL_PORT="${MYSQL_PORT:-3306}"
          ACTUAL_DB="${MYSQL_DATABASE:-${DB_DATABASE:-techneyo_portfolio}}"
          ACTUAL_USER="${MYSQL_USER:-${DB_USER:-root}}"
          ACTUAL_PASS="${MYSQL_PASSWORD:-${DB_PASSWORD:-}}"
          ACTUAL_ADMIN_EMAIL="${ADMIN_EMAIL:-admin@techneyo.com}"

          printf "%s\n" \
            "MYSQL_HOST=${ACTUAL_HOST}" \
            "MYSQL_PORT=${ACTUAL_PORT}" \
            "MYSQL_DATABASE=${ACTUAL_DB}" \
            "MYSQL_USER=${ACTUAL_USER}" \
            "MYSQL_PASSWORD=${ACTUAL_PASS}" \
            "JWT_SECRET=${JWT_SECRET}" \
            "ADMIN_EMAIL=${ACTUAL_ADMIN_EMAIL}" \
            "ADMIN_PASSWORD=${ADMIN_PASSWORD}" > dist/.env

          chmod 600 dist/.env
          echo "Production .env created in dist/ with database: ${ACTUAL_DB} and user: ${ACTUAL_USER}"

      - name: Confirm dist folder & backend assets
        run: |
          ls -la
          ls -la dist
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/index.php
          test -f dist/.env
          echo "Verified dist/ contains index.html, .htaccess, api/index.php, and .env"

      - name: Deploy dist files to Hostinger public_html
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.HOSTINGER_DEPLOY_PATH || 'public_html/' }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/subdomains/, /.well-known/"
